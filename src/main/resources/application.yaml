spring:
  application:
    name: signature-app

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/signature_app?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    hikari:
      max-lifetime: 300000
      keepalive-time: 60000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  jwt-secret: ${JWT_SECRET}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

# S3StorageService reads these. AWS credentials themselves are NOT set
# here - the SDK's default credential chain reads AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY directly from environment variables, so they
# never need to pass through Spring config at all.
aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${AWS_S3_BUCKET}
